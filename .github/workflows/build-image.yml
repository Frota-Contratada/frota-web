name: Build Web Image

on:
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "deploy/**"
      - "scripts/check-dual-bundle.py"
      - "src/**"
      - ".github/workflows/build-image.yml"

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build production web image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate production configuration
        shell: bash
        env:
          LOCAL_VITE_API_URL: ${{ vars.PROD_VITE_API_URL }}
          LOCAL_VITE_WS_URL: ${{ vars.PROD_VITE_WS_URL }}
          LOCAL_VITE_ACOMPANHAMENTO_URL: ${{ vars.PROD_VITE_ACOMPANHAMENTO_URL }}
          LOCAL_VITE_IA_API_URL: ${{ vars.PROD_VITE_IA_API_URL }}
          HML_VITE_API_URL: ${{ vars.HML_VITE_API_URL }}
          HML_VITE_WS_URL: ${{ vars.HML_VITE_WS_URL }}
          HML_VITE_ACOMPANHAMENTO_URL: ${{ vars.HML_VITE_ACOMPANHAMENTO_URL }}
          HML_VITE_IA_API_URL: ${{ vars.HML_VITE_IA_API_URL }}
          VITE_TOMTOM_API_KEY: ${{ secrets.PROD_VITE_TOMTOM_API_KEY }}
        run: |
          set -euo pipefail

          test -n "$LOCAL_VITE_API_URL"
          test -n "$LOCAL_VITE_WS_URL"
          test -n "$LOCAL_VITE_ACOMPANHAMENTO_URL"
          test -n "$LOCAL_VITE_IA_API_URL"
          test -n "$HML_VITE_API_URL"
          test -n "$HML_VITE_WS_URL"
          test -n "$HML_VITE_ACOMPANHAMENTO_URL"
          test -n "$HML_VITE_IA_API_URL"
          test -n "$VITE_TOMTOM_API_KEY"

      - name: Define image metadata
        id: meta
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::12}"

          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "image=frota-web:$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "archive=frota-web-$SHORT_SHA.tar" >> "$GITHUB_OUTPUT"

      - name: Build production image
        shell: bash
        env:
          LOCAL_VITE_API_URL: ${{ vars.PROD_VITE_API_URL }}
          LOCAL_VITE_WS_URL: ${{ vars.PROD_VITE_WS_URL }}
          LOCAL_VITE_ACOMPANHAMENTO_URL: ${{ vars.PROD_VITE_ACOMPANHAMENTO_URL }}
          LOCAL_VITE_IA_API_URL: ${{ vars.PROD_VITE_IA_API_URL }}
          HML_VITE_API_URL: ${{ vars.HML_VITE_API_URL }}
          HML_VITE_WS_URL: ${{ vars.HML_VITE_WS_URL }}
          HML_VITE_ACOMPANHAMENTO_URL: ${{ vars.HML_VITE_ACOMPANHAMENTO_URL }}
          HML_VITE_IA_API_URL: ${{ vars.HML_VITE_IA_API_URL }}
          VITE_TOMTOM_API_KEY: ${{ secrets.PROD_VITE_TOMTOM_API_KEY }}
        run: |
          set -euo pipefail

          docker build \
            --platform linux/amd64 \
            --target runner \
            --build-arg "LOCAL_VITE_API_URL=$LOCAL_VITE_API_URL" \
            --build-arg "LOCAL_VITE_WS_URL=$LOCAL_VITE_WS_URL" \
            --build-arg "LOCAL_VITE_ACOMPANHAMENTO_URL=$LOCAL_VITE_ACOMPANHAMENTO_URL" \
            --build-arg "LOCAL_VITE_IA_API_URL=$LOCAL_VITE_IA_API_URL" \
            --build-arg "HML_VITE_API_URL=$HML_VITE_API_URL" \
            --build-arg "HML_VITE_WS_URL=$HML_VITE_WS_URL" \
            --build-arg "HML_VITE_ACOMPANHAMENTO_URL=$HML_VITE_ACOMPANHAMENTO_URL" \
            --build-arg "HML_VITE_IA_API_URL=$HML_VITE_IA_API_URL" \
            --build-arg "VITE_TOMTOM_API_KEY=$VITE_TOMTOM_API_KEY" \
            --tag "${{ steps.meta.outputs.image }}" \
            .

      - name: Smoke test image
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-dual-bundle.py "${{ steps.meta.outputs.image }}"

      - name: Export image
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifact

          docker save \
            "${{ steps.meta.outputs.image }}" \
            -o "artifact/${{ steps.meta.outputs.archive }}"

          cd artifact

          sha256sum \
            "${{ steps.meta.outputs.archive }}" \
            > "${{ steps.meta.outputs.archive }}.sha256"

      - name: Create manifest
        shell: bash
        run: |
          set -euo pipefail

          cat > artifact/manifest.json <<EOF
          {
            "repository": "Frota-Contratada/frota-web",
            "commit": "${GITHUB_SHA}",
            "shortCommit": "${{ steps.meta.outputs.short_sha }}",
            "image": "${{ steps.meta.outputs.image }}",
            "archive": "${{ steps.meta.outputs.archive }}"
          }
          EOF

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frota-web-${{ steps.meta.outputs.short_sha }}
          path: artifact/
          if-no-files-found: error
          retention-days: 14
