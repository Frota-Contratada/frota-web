name: Build Gateway Image

on:
  pull_request:
    paths:
      - "gateway/**"
      - ".github/workflows/build-gateway-image.yml"

  push:
    branches:
      - main
    paths:
      - "gateway/**"
      - ".github/workflows/build-gateway-image.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build gateway image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Define image metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          SHORT_SHA="${GITHUB_SHA::12}"

          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "image=frota-gateway:$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "archive=frota-gateway-$SHORT_SHA.tar" >> "$GITHUB_OUTPUT"

      - name: Build image
        shell: bash
        run: |
          set -euo pipefail

          docker build \
            --platform linux/amd64 \
            --tag "${{ steps.meta.outputs.image }}" \
            gateway

      - name: Generate CI-only TLS certificate
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p .ci-tls

          openssl req \
            -x509 -newkey rsa:2048 -nodes -sha256 -days 1 \
            -subj "/CN=frota-contratada.hml.seara.com.br" \
            -addext "subjectAltName=DNS:frota-contratada.hml.seara.com.br,DNS:api.frota-contratada.hml.seara.com.br,IP:127.0.0.1" \
            -keyout .ci-tls/server.key \
            -out .ci-tls/server.crt

      - name: Validate Nginx configuration
        shell: bash
        run: |
          set -euo pipefail

          docker run \
            --rm \
            --volume "$PWD/.ci-tls:/etc/nginx/tls:ro" \
            --env WEB_HOST=frota.local \
            --env API_HOST=api.frota.local \
            --env ACOMPANHAMENTO_HOST=acompanhamento.frota.local \
            --env IA_HOST=ia.frota.local \
            "${{ steps.meta.outputs.image }}" \
            nginx -t

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          python3 gateway/ci-smoke.py "${{ steps.meta.outputs.image }}" .ci-tls

      - name: Remove CI TLS material
        if: always()
        shell: bash
        run: rm -f .ci-tls/server.key .ci-tls/server.crt

      - name: Export image
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifact

          docker save \
            "${{ steps.meta.outputs.image }}" \
            -o "artifact/${{ steps.meta.outputs.archive }}"

          cd artifact

          sha256sum \
            "${{ steps.meta.outputs.archive }}" \
            > "${{ steps.meta.outputs.archive }}.sha256"

      - name: Create manifest
        shell: bash
        run: |
          set -euo pipefail

          cat > artifact/manifest.json <<EOF
          {
            "repository": "Frota-Contratada/frota-web",
            "component": "gateway",
            "commit": "${GITHUB_SHA}",
            "shortCommit": "${{ steps.meta.outputs.short_sha }}",
            "image": "${{ steps.meta.outputs.image }}",
            "archive": "${{ steps.meta.outputs.archive }}"
          }
          EOF

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frota-gateway-${{ steps.meta.outputs.short_sha }}
          path: artifact/
          if-no-files-found: error
          retention-days: 14
