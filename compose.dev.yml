services:
  web:
    build:
      context: .
      target: dev

    ports:
      - "5173:5173"

    env_file:
      - .env

    volumes:
      - .:/app
      - web_node_modules:/app/node_modules

    command:
      - npm
      - run
      - dev
      - --
      - --host
      - 0.0.0.0
      - --port
      - "5173"

volumes:
  web_node_modules:
